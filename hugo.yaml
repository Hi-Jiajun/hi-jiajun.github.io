baseURL: "https://hi-jiajun.github.io/"
languageCode: "zh-cn"
defaultContentLanguage: "zh"
title: "我的博客"
theme: "PaperMod"
paginate: 5

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

# 中文配置
languages:
  zh:
    languageName: "中文"
    weight: 1
    title: "我的博客"
    params:
      description: "个人技术博客"

# 日期格式
enableEmoji: true

# 搜索功能
outputs:
  home:
    - HTML
    - RSS
    - JSON

# 作者信息
params:
  env: production
  description: "这是我的个人博客，分享技术文章和生活感悟"
  keywords: ["博客", "技术", "编程", "开发"]
  author: "Your Name"

  # 社交链接
  socialIcons:
    - name: "github"
      url: "https://github.com/Hi-Jiajun"
    - name: "email"
      url: "mailto:hi.jiajun@outlook.com"

  # 首页信息
  homeInfoParams:
    Title: "欢迎来到我的博客 👋"
    Content: |
      这里是我的个人空间，记录技术学习笔记、项目经验和生活感悟。

      - 🔭 正在探索新技术
      - 🌱 持续学习中
      - 💬 欢迎交流讨论

      [GitHub](https://github.com/Hi-Jiajun) · [Email](mailto:hi.jiajun@outlook.com)

  # 文章列表配置
  showPosts: 1
  showBreadCrumbs: true
  showCodeCopyButtons: true
  showShareButtons: true
  showReadingTime: true
  showTableOfContents: true
  showPrevNext: true

  # 搜索配置
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

  # 评论系统 (Giscus)
  comments:
    provider: "giscus"
    giscus:
      repo: "Hi-Jiajun/hi-jiajun.github.io"
      repoId: "你的repoId"
      category: "Announcements"
      categoryId: "你的categoryId"
      mapping: "pathname"
      reactionsEnabled: "1"
      emitMetadata: "0"
      inputPosition: "top"
      theme: "preferred_color_scheme"
      lang: "zh-CN"

# 菜单配置
menu:
  main:
    - identifier: "posts"
      name: "文章"
      url: "/posts/"
      weight: 10
    - identifier: "tags"
      name: "标签"
      url: "/tags/"
      weight: 20
    - identifier: "archives"
      name: "归档"
      url: "/archives/"
      weight: 30
    - identifier: "search"
      name: "搜索"
      url: "/search/"
      weight: 40
    - identifier: "about"
      name: "关于"
      url: "/about/"
      weight: 50

# 标签和分类
taxonomies:
  category: "categories"
  tag: "tags"

# Markdown 渲染配置
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: "monokai"
