name: Deploy Astro Blog to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        env:
          TZ: Asia/Shanghai
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-profile:
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    env:
      PROFILE_SYNC_TOKEN: ${{ secrets.PROFILE_SYNC_TOKEN }}
    steps:
      - name: Trigger Hi-Jiajun profile README refresh
        run: |
          if [ -z "$PROFILE_SYNC_TOKEN" ]; then
            echo "PROFILE_SYNC_TOKEN secret not configured; skipping immediate profile dispatch (daily cron still syncs)."
            exit 0
          fi
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PROFILE_SYNC_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Hi-Jiajun/Hi-Jiajun/dispatches \
            -d '{"event_type":"blog-published"}'
          echo "Dispatched blog-published to Hi-Jiajun/Hi-Jiajun."
