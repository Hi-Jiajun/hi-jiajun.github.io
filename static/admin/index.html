<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>博客管理 - Content Manager</title>
  <style>
    /* 自定义登录界面样式 */
    .login-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .login-box {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    .login-box h1 {
      margin: 0 0 10px;
      color: #333;
      font-size: 24px;
    }
    .login-box p {
      color: #666;
      margin-bottom: 30px;
    }
    .login-box input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      box-sizing: border-box;
      transition: border-color 0.3s;
    }
    .login-box input:focus {
      outline: none;
      border-color: #667eea;
    }
    .login-box button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .login-box button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }
    .login-box .hint {
      margin-top: 20px;
      padding: 16px;
      background: #f5f5f5;
      border-radius: 8px;
      font-size: 13px;
      color: #666;
      text-align: left;
    }
    .login-box .hint a {
      color: #667eea;
      text-decoration: none;
    }
    .login-box .hint a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 自定义登录界面 -->
    <div class="login-wrapper" id="login-page">
      <div class="login-box">
        <h1>📝 博客管理</h1>
        <p>使用 GitHub Personal Access Token 登录</p>
        <input type="password" id="token-input" placeholder="请输入 GitHub Personal Access Token" />
        <button onclick="login()">登 录</button>
        <div class="hint">
          <strong>如何获取 Token：</strong><br/>
          1. 访问 <a href="https://github.com/settings/tokens" target="_blank">GitHub Token 设置</a><br/>
          2. 点击 "Generate new token" → "Classic"<br/>
          3. 勾选 "repo" 权限<br/>
          4. 复制生成的 Token 粘贴到上方输入框
        </div>
      </div>
    </div>
  </div>

  <script>
    // 检查是否已经有 token
    function getToken() {
      return localStorage.getItem('gh_token') || '';
    }

    // 保存 token
    function setToken(token) {
      localStorage.setItem('gh_token', token);
    }

    // 登录函数
    function login() {
      const token = document.getElementById('token-input').value.trim();
      if (!token) {
        alert('请输入 GitHub Personal Access Token');
        return;
      }
      setToken(token);
      // 重定向到 CMS，带上 token 参数
      window.location.href = '/admin/?token=' + encodeURIComponent(token);
    }

    // 检查 URL 中是否有 token 参数
    const urlParams = new URLSearchParams(window.location.search);
    const tokenFromUrl = urlParams.get('token');

    if (tokenFromUrl) {
      setToken(tokenFromUrl);
      // 清除 URL 中的 token 参数
      window.history.replaceState({}, document.title, '/admin/');
      // 加载 CMS
      loadCMS();
    } else if (getToken()) {
      // 已有 token，直接加载 CMS
      loadCMS();
    }

    // 加载 CMS
    function loadCMS() {
      const token = getToken();
      if (!token) {
        document.getElementById('login-page').style.display = 'flex';
        return;
      }

      // 隐藏登录页面
      document.getElementById('login-page').style.display = 'none';

      // 动态加载 Decap CMS
      const script = document.createElement('script');
      script.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
      script.onload = function() {
        // 配置 CMS 使用 token
        window.CMS.init();
        // 设置 token 到 localStorage，供 CMS 使用
        localStorage.setItem('decap-cms-github-token', token);
      };
      document.body.appendChild(script);
    }

    // 如果没有 token 也没有 URL 参数，显示登录页面
    if (!tokenFromUrl && !getToken()) {
      document.getElementById('login-page').style.display = 'flex';
    }
  </script>
</body>
</html>
